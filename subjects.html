
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Subjects | Smart Attendance</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="app-layout">

    <aside class="sidebar">
        <div class="logo">Smart Attendance</div>
        <div class="nav-label">Main Menu</div>

        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Dashboard</a>
            <a href="subjects.html" class="nav-link active">Subjects</a>
            <a href="attendance.html" class="nav-link">Attendance</a>
            <a href="reports.html" class="nav-link">Reports</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="page-header">
            <div>
                <h1 class="page-title">Subject Management</h1>
                <p class="page-description">
                    Add and manage your academic subjects.
                </p>
            </div>
        </header>

        <section class="card">
            <h2 class="card-title">Add New Subject</h2>

            <form id="subjectForm">

                <div class="form-group">
                    <label for="subjectName">Subject Name</label>
                    <input type="text" id="subjectName"
                           placeholder="Enter subject name" required>
                </div>

                <div class="form-group">
                    <label for="subjectCode">Subject Code</label>
                    <input type="text" id="subjectCode"
                           placeholder="Enter subject code">
                </div>

                <div class="form-group">
                    <label for="targetPercentage">
                        Required Attendance (%)
                    </label>
                    <input type="number" id="targetPercentage"
                           value="75" min="1" max="100" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Subject
                </button>

            </form>
        </section>

        <section class="card mt-20">
            <h2 class="card-title">Your Subjects</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Code</th>
                            <th>Target</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="subjectTableBody">
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</div>

<script src="js/storage.js"></script>
<script src="js/subjects.js"></script>

</body>
</html>
